<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="color-scheme" content="light"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BarakPol PNP – Prototype Web</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--c1:#E3F2FD;--c2:#90CAF9;--c3:#2196F3;--c4:#0D47A1;--bg:#F6FAFE;--card:#fff;--tx:#0B2545;--mu:#5B7391;--ln:#D6E6F5;--err:#C62828;--errb:#FDECEA;--ok:#1B7F4B;--okb:#E4F6EC;--out:#DCE9F6;--warn:#B26A00}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--out);color:var(--tx);display:flex;align-items:center;justify-content:center;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{display:flex;flex-direction:column;align-items:center;gap:10px;height:100%;width:100%;padding:8px}
.demo{display:flex;gap:6px;font-size:12px;align-items:center;color:var(--mu);flex-wrap:wrap;justify-content:center}
.demo button{border:1px solid var(--c2);background:var(--card);color:var(--c4);border-radius:99px;padding:5px 11px;font:inherit;font-weight:600;cursor:pointer}
.phone{width:390px;max-width:100%;flex:1;min-height:0;background:var(--bg);border-radius:28px;border:1px solid var(--ln);box-shadow:0 12px 40px rgba(13,71,161,.18);display:flex;flex-direction:column;overflow:hidden;position:relative}
@media(max-width:480px){.phone{border-radius:18px}}
.scr{flex:1;overflow-y:auto;padding:16px}
.top{background:var(--c4);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;font-weight:800}
.top .b{background:none;border:0;color:#fff;font-size:20px;cursor:pointer;padding:0 4px}
.top small{font-weight:400;opacity:.8;display:block;font-size:11px}
.nav{display:flex;border-top:1px solid var(--ln);background:var(--card)}
.nav button{flex:1;border:0;background:none;padding:9px 0 8px;font:inherit;font-size:11px;color:var(--mu);cursor:pointer}
.nav button.on{color:var(--c3);font-weight:800}.nav b{display:block;font-size:18px}
h1{font-size:24px;line-height:1.2;font-weight:800}h2{font-size:16px;margin:16px 0 8px;font-weight:800}
p.m,.m{color:var(--mu);font-size:13px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.g{flex:1}
.ic{width:46px;height:46px;border-radius:12px;background:var(--c1);display:grid;place-items:center;font-size:24px;flex:none}
.btn{display:block;width:100%;border:0;border-radius:12px;background:var(--c3);color:#fff;padding:13px;font:inherit;font-weight:800;font-size:14px;cursor:pointer;margin-top:10px}
.btn.s{background:var(--c1);color:var(--c4)}.btn.o{background:none;border:1.5px solid var(--c3);color:var(--c3)}.btn.d{background:var(--errb);color:var(--err)}
.btn.sm{width:auto;padding:7px 13px;margin:0;font-size:12px;display:inline-block}
.btn:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{width:100%;border:1.5px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;padding:11px;font:inherit;font-size:14px;margin:4px 0 8px}
input:focus,select:focus,button:focus-visible,textarea:focus{outline:2px solid var(--c3);outline-offset:1px}
label{font-size:12px;font-weight:600;color:var(--mu)}
.chip{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;background:var(--c1);color:var(--c4)}
.chip.e{background:var(--errb);color:var(--err)}.chip.k{background:var(--okb);color:var(--ok)}.chip.w{background:#FFF3DC;color:var(--warn)}
.err{background:var(--errb);color:var(--err);border-radius:10px;padding:10px;font-size:13px;margin:8px 0}
.okb{background:var(--okb);color:var(--ok);border-radius:10px;padding:10px;font-size:13px;margin:8px 0}
.hero{background:linear-gradient(135deg,var(--c4),var(--c3));color:#fff;border-radius:18px;padding:18px;margin-bottom:6px}
.hero p{opacity:.85;font-size:13px;margin-top:4px}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:28px;height:28px;border-radius:8px;border:0;background:var(--c3);color:#fff;font-size:16px;cursor:pointer}.qty button.mn{background:var(--c1);color:var(--c4)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{border:1.5px solid var(--c2);background:var(--card);color:var(--c4);border-radius:10px;padding:10px 0;font:inherit;font-weight:700;cursor:pointer}
.slot.on{background:var(--c3);color:#fff;border-color:var(--c3)}.slot:disabled{background:var(--errb);color:var(--err);border-color:transparent;text-decoration:line-through;cursor:not-allowed}
.code{font-size:34px;font-weight:800;letter-spacing:6px;color:var(--c4);text-align:center;background:var(--c1);border-radius:14px;padding:16px;margin:10px 0}
.steps{display:flex;margin:14px 0}.st{flex:1;text-align:center;font-size:11px;color:var(--mu)}.st i{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ln);margin:0 auto 4px;font-style:normal;font-weight:800}.st.on{color:var(--c3);font-weight:800}.st.on i{background:var(--c3);color:#fff}
.tabs{display:flex;background:var(--c1);border-radius:12px;padding:3px;margin-bottom:12px}.tabs button{flex:1;border:0;background:none;border-radius:10px;padding:8px;font:inherit;font-size:12px;font-weight:700;color:var(--c4);cursor:pointer}.tabs button.on{background:var(--c3);color:#fff}
.phones{display:flex;gap:20px;flex:1;min-height:0;width:100%;justify-content:center;align-items:stretch;overflow-x:auto}.col{display:flex;flex-direction:column;gap:6px;min-height:0;flex:0 1 390px;min-width:0}.col .phone{flex:1}.lbl{text-align:center;font-weight:800;font-size:13px;color:var(--c4)}.demo button.on{background:var(--c3);color:#fff;border-color:var(--c3)}.lg{width:34px;height:34px;background:#fff;border-radius:10px;padding:2px;object-fit:contain;flex:none}.av{width:72px;height:72px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;font-weight:800;font-size:24px;color:var(--c4);background:var(--c2)}.qr{width:200px;margin:10px auto;background:#fff;padding:10px;border-radius:12px;border:1px solid var(--ln)}.qr svg{width:100%;height:auto;display:block}.phone{width:100%;max-width:none;border-radius:12px}.app{display:flex;flex-direction:column;flex:1;min-height:0}
.phones.m1 .col{flex:1 1 1180px;max-width:1180px}.phones.m2 .col{flex:1 1 0;max-width:720px}
.chrome{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--c1);border-bottom:1px solid var(--ln);font-size:12px;color:var(--mu)}.chrome i{width:10px;height:10px;border-radius:50%;background:var(--c2)}.chrome span{margin-left:8px;background:var(--card);border-radius:99px;padding:3px 12px;flex:1;max-width:360px}
.app .top{order:0;padding:12px max(16px,calc((100% - 1040px)/2))}.app .nav{order:1;justify-content:flex-start;gap:4px;padding:0 max(12px,calc((100% - 1040px)/2));border-top:0;border-bottom:1px solid var(--ln)}.app .scr{order:2}
.nav button{flex:none;display:flex;gap:6px;align-items:center;padding:12px 16px;font-size:13px;border-bottom:3px solid transparent}.nav button.on{border-bottom-color:var(--c3)}.nav b{display:inline;font-size:15px}
.scr.wide{padding:20px max(16px,calc((100% - 1040px)/2))}.scr.narrow{padding:20px max(16px,calc((100% - 560px)/2))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}.grid>.card{margin-bottom:0}
.phone .toast{left:auto;right:16px;max-width:360px;top:56px}.phone .modal{align-items:center;justify-content:center}.phone .modal>div{max-width:420px;border-radius:16px}
.toast{position:absolute;left:12px;right:12px;top:12px;background:var(--c4);color:#fff;border-radius:12px;padding:12px;font-size:13px;z-index:9;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.modal{position:absolute;inset:0;background:rgba(5,20,45,.55);display:flex;align-items:flex-end;z-index:8}.modal>div{background:var(--card);width:100%;border-radius:20px 20px 0 0;padding:18px}
.star{font-size:28px;cursor:pointer;background:none;border:0;color:var(--ln)}.star.on{color:#F5A623}
.big{text-align:center;padding:24px 0}.big .e{font-size:54px}
</style></head><body>
<div class="wrap">
<div class="demo"><span id="rb"><button onclick="asRole('mhs')">Mahasiswa</button> <button onclick="asRole('own')">Pemilik</button></span><button id="m1" onclick="setup(1)">1 layar</button><button id="m2" onclick="setup(2)">2 layar (demo kelas)</button><button onclick="resetAll()">Mulai ulang</button></div>
<div class="phones" id="phones"></div>
</div>

function qrSvg(t){let n,dark;
 try{const q=qrcode(0,'M');q.addData(t);q.make();n=q.getModuleCount();dark=(x,y)=>q.isDark(y,x)}catch(e){n=25;let s=1;for(const c of t)s=(Math.imul(s,31)+c.charCodeAt(0))>>>0;const fin=(x,y)=>(x<8&&y<8)||(x>=n-8&&y<8)||(x<8&&y>=n-8);const g={};for(let y=0;y<n;y++)for(let x=0;x<n;x++){s=(Math.imul(s,1664525)+1013904223)>>>0;g[x+','+y]=!fin(x,y)&&(s>>>16&1)}
  const ring=(x,y)=>{const f=(a,b)=>{const dx=a-x,dy=b-y;return dx>=0&&dx<7&&dy>=0&&dy<7&&(dx==0||dx==6||dy==0||dy==6||(dx>=2&&dx<=4&&dy>=2&&dy<=4))};return f};const rs=[ring(0,0),ring(n-7,0),ring(0,n-7)];dark=(x,y)=>g[x+','+y]||rs.some(r=>r(x,y))}
 let b='';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(dark(x,y))b+=`<rect x="${x}" y="${y}" width="1.02" height="1.02"/>`;
 return `<svg viewBox="-2 -2 ${n+4} ${n+4}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kode QRIS"><rect x="-2" y="-2" width="${n+4}" height="${n+4}" fill="#fff"/><g fill="#0B2545">${b}</g></svg>`}
function pick(i){CUR=PH[i];S=CUR.S}

(m===2?['💻 Mahasiswa','🧑‍🍳 Pemilik Barak']:['']).forEach((l,i)=>{const st=i?Object.assign(init(),{kios:base.kios,orders:base.orders,scr:'dash',role:'own',tab:'orders'}):base;const col=document.createElement('div');col.className='col';col.innerHTML=(l?`<div class="lbl">${l}</div>`:'')+'<div class="phone"><div class="chrome"><i></i><i></i><i></i><span>🔒 barakpol.pnp.ac.id</span></div><div class="app"></div></div>';box.appendChild(col);PH.push({S:st,ph:col.querySelector('.phone'),app:col.querySelector('.app')});['pointerdown','focusin','click'].forEach(ev=>col.addEventListener(ev,()=>pick(i),true))});
$('#rb').style.display=m===2?'none':'';$('#m1').className=m===1?'on':'';$('#m2').className=m===2?'on':'';
PH.forEach((p,i)=>{pick(i);draw()});pick(0)}
function draw(){const a=CUR.app;a.innerHTML=V[S.scr]();const s=a.querySelector('.scr');if(s)s.classList.add(['home','kios','dash'].includes(S.scr)?'wide':'narrow');if(s&&S._st!==S.scr){s.scrollTop=0}S._st=S.scr;
 if(S.scr==='status'||S.scr==='home'){const o=ord();if(o&&o.mine&&o.seen!==o.st&&o.st!=='wait'){o.seen=o.st;toast({pay:'Barak menerima pesananmu. Silakan bayar sekarang.',proc:'Pembayaran berhasil. Barak mulai menyiapkan pesananmu.',ready:'Pesananmu siap! Datang saat nomor antrianmu dipanggil.',rej:'Pesanan ditolak barak. Kamu belum ditagih.',done:'Pesanan selesai.'}[o.st]||'')}}}
function modal(t){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div><h2 style="margin-top:0">Simulasi ${S.pay}</h2><p class="m">Total ${rp(ord().total)}. Pilih hasil pembayaran untuk melihat alurnya.</p><button class="btn" id="ok">Pembayaran berhasil</button><button class="btn d" id="no">Pembayaran gagal</button></div>`;CUR.ph.appendChild(m);
 m.querySelector('#ok').onclick=()=>{m.remove();paySuccess()};m.querySelector('#no').onclick=()=>{m.remove();S.tries++;go('payfail')}}

function saveOwn(){const v=['g1','g2','g3','g4','g5'].map(i=>$('#'+i).value.trim());S.tmp={kn:v[0],kd:v[1],nama:v[2],jam:v[3],hp:v[4]};if(v.some(x=>!x)||!/^[0-9+\- ]{9,15}$/.test(v[4])){S.err='Data belum lengkap. Isi semua kolom dan nomor HP yang valid.';return render()}const k=kios(1);k.name=v[0];k.d=v[1];Object.assign(S.own,{nama:v[2],jam:v[3],hp:v[4]});S.tmp=null;go('oprof');toast('Profil kios diperbarui dan tampil di aplikasi mahasiswa.')}
